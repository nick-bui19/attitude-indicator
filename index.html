<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attitude Indicator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Attitude Indicator</h1>

      <button id="enable">Enable Motion Sensors</button>

      <div class="canvas-wrap">
        <canvas id="horizon"></canvas>
      </div>

      <div class="card">
        <div>alpha (yaw) <span id="alpha">--</span></div>
        <div>beta (pitch) <span id="beta">--</span></div>
        <div>gamma (roll) <span id="gamma">--</span></div>
        <div>permission <span id="perm">--</span></div>
      </div>

      <p class="hint">
        iOS requires a tap to enable. Hold phone in portrait and tilt.
      </p>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
